<header class="topbar">
  <a class="brand" routerLink="/" aria-label="Flowly home">
    <span class="logo" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="brand-name">Flowly</span>
  </a>

  <nav class="nav">
    <a routerLink="/day" routerLinkActive="active" class="my-day">My day</a>
    <span class="divider" aria-hidden="true"></span>

    @if (creating()) {
      <form class="ws-create" (ngSubmit)="createWorkspace()">
        <input name="ws" [(ngModel)]="newName" placeholder="Workspace name" aria-label="New workspace name" autofocus />
        <button class="btn primary small" type="submit">Create</button>
        <button class="btn ghost small" type="button" (click)="creating.set(false)">Cancel</button>
      </form>
    } @else {
      <select class="ws-select" aria-label="Workspace" (change)="switchTo($any($event.target).value)">
        @for (ws of store.workspaces(); track ws.id) {
          <option [value]="ws.id" [selected]="ws.id === store.navId()">{{ ws.name }}</option>
        }
        <option value="new">+ New workspace…</option>
      </select>
    }

    @if (store.navId(); as id) {
      <a [routerLink]="['/w', id, 'board']" routerLinkActive="active">Board</a>
      <a [routerLink]="['/w', id, 'projects']" routerLinkActive="active">Projects</a>
      <a [routerLink]="['/w', id, 'tags']" routerLinkActive="active">Tags</a>
      <a [routerLink]="['/w', id, 'integrations']" routerLinkActive="active">Integrations</a>
      <a [routerLink]="['/w', id, 'members']" routerLinkActive="active">Members</a>
    }
  </nav>

  <div class="user">
    <button class="btn ghost icon" type="button" (click)="menuOpen.set(!menuOpen())" [attr.aria-expanded]="menuOpen()">
      <span class="avatar">{{ initials(auth.user()?.full_name || auth.user()?.email || '?') }}</span>
      <span class="user-name">{{ auth.user()?.full_name || auth.user()?.email }}</span>
    </button>
    @if (menuOpen()) {
      <div class="menu" role="menu">
        <div class="menu-email muted">{{ auth.user()?.email }}</div>
        <div class="menu-label">Theme</div>
        <div class="theme-switch" role="group" aria-label="Theme">
          @for (opt of themes; track opt.value) {
            <button
              type="button"
              [class.on]="theme.theme() === opt.value"
              [attr.aria-pressed]="theme.theme() === opt.value"
              (click)="theme.set(opt.value)"
            >
              <span aria-hidden="true">{{ opt.icon }}</span> {{ opt.label }}
            </button>
          }
        </div>
        <button class="btn ghost block" type="button" role="menuitem" (click)="auth.logout()">Sign out</button>
      </div>
    }
  </div>
</header>

<main class="main">
  <router-outlet />
</main>
