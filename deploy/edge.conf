# Traefik terminates TLS and hands these hosts to this nginx, which forwards to the Flowly containers.
# api.flowly.net → backend (Django) directly; everything else → web container (SPA + /api proxy).
server {
  listen 80;
  server_name api.flowly.net;
  client_max_body_size 30m;
  location / {
    proxy_pass http://51.15.160.236:8010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }
}

server {
  listen 80 default_server;
  client_max_body_size 30m;
  location / {
    proxy_pass http://51.15.160.236:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }
}
