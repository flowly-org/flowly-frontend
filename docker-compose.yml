services:
  web:
    build: .
    environment:
      # What the browser calls. "/api" goes through this container's nginx proxy (recommended).
      API_URL: ${API_URL:-/api}
      # Where nginx forwards /api, /admin and /static.
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:8000}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80"
