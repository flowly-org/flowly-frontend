# Netlify hosts the built SPA; API, admin and static files are proxied to the backend so the
# browser stays on one origin (no CORS, cookies and redirects just work).
[build]
  command = "npx ng build --configuration production"
  publish = "dist/flowly-frontend/browser"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/*"
  to = "https://api.flowly.net/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "https://api.flowly.net/admin/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/static/*"
  to = "https://api.flowly.net/static/:splat"
  status = 200
  force = true

# SPA routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/config.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
