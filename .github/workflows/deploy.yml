name: Build & deploy to Netlify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: netlify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx ng build --configuration production

      - name: Deploy (production)
        if: github.event_name == 'push' && env.NETLIFY_AUTH_TOKEN != ''
        run: npx --yes netlify-cli@17 deploy --prod --dir dist/flowly-frontend/browser --message "${{ github.sha }}"

      - name: Deploy (preview)
        id: preview
        if: github.event_name == 'pull_request' && env.NETLIFY_AUTH_TOKEN != ''
        run: |
          npx --yes netlify-cli@17 deploy --dir dist/flowly-frontend/browser \
            --alias "pr-${{ github.event.number }}" --message "PR #${{ github.event.number }}" --json > deploy.json
          echo "url=$(node -p "require('./deploy.json').deploy_url")" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        if: steps.preview.outputs.url
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `Preview deployed: ${{ steps.preview.outputs.url }}`,
            });

      - name: Netlify not configured
        if: env.NETLIFY_AUTH_TOKEN == ''
        run: echo "::warning::Set NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID repository secrets to deploy."
