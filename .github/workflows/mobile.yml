name: Mobile apps

on:
  push:
    branches: [main]
    tags: ["mobile-v*"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build:mobile
      - run: npx cap sync android
      - name: Build APK (debug, unsigned for store)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: flowly-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:mobile
      - run: npx cap sync ios
      - name: Build for the iOS simulator (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          cd build/Build/Products/Debug-iphonesimulator && zip -qr ../../../../Flowly-simulator.zip App.app
      - uses: actions/upload-artifact@v4
        with:
          name: flowly-ios-simulator
          path: Flowly-simulator.zip
