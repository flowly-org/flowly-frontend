name: Mobile apps

on:
  push:
    branches: [main]
    tags: ["mobile-v*"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build:mobile
      - run: npx cap sync android
      - name: Build signed APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FLOWLY_VERSION_CODE: ${{ github.run_number }}
          FLOWLY_VERSION_NAME: 0.2.${{ github.run_number }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/flowly.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/flowly.jks"
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Flowly-Android.apk"
          rm -f "$RUNNER_TEMP/flowly.jks"
      # Forks have no signing key: a debug build installs the same way (Android asks to allow it).
      - name: Build debug APK (no signing key)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: android
        env:
          FLOWLY_VERSION_CODE: ${{ github.run_number }}
          FLOWLY_VERSION_NAME: 0.2.${{ github.run_number }}
        run: |
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Flowly-Android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: flowly-android-apk
          path: Flowly-Android.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:mobile
      - run: npx cap sync ios
      - name: Build for the iOS simulator (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          cd build/Build/Products/Debug-iphonesimulator && zip -qr ../../../../Flowly-simulator.zip App.app
      - uses: actions/upload-artifact@v4
        with:
          name: flowly-ios-simulator
          path: Flowly-simulator.zip
